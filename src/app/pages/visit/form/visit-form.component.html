<app-header></app-header>

<div class="container p-4">
  <a (click)="cancel()" class="text-decoration-none fw-bold" style="cursor: pointer;">
    <i class="bi bi-arrow-left me-1"></i>
    Voltar
  </a>
</div>

<div class="container px-4">
  <h1 class="h2 mb-4">{{ isEdit() ? 'Editar' : 'Cadastrar nova' }} Visita</h1>
</div>

@if (loading()) {
  <app-loading></app-loading>
} @else {

<form (ngSubmit)="save()">

  <!-- Dados gerais -->
  <app-container-form title="Dados gerais">

    <div class="row g-3">

      <div class="col-md-4">
        <label class="form-label">Data da visita</label>
        <input
          type="date"
          class="form-control"
          [value]="visit()!.visitDate"
          (input)="updateField('visitDate', $any($event.target).value)"
          required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Hora início</label>
        <input
          type="time"
          class="form-control"
          [value]="visit()!.startTime"
          (input)="updateField('startTime', $any($event.target).value)"
          required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Hora fim</label>
        <input
          type="time"
          class="form-control"
          [value]="visit()!.endTime"
          (input)="updateField('endTime', $any($event.target).value)">
      </div>

    </div>

    <div class="mt-3">
      <label class="form-label">Propósito</label>
      <textarea
        rows="2"
        class="form-control"
        [value]="visit()!.purpose"
        (input)="updateField('purpose', $any($event.target).value)"
        placeholder="Ex: visita técnica, acompanhamento, avaliação..."
        required>
      </textarea>
    </div>

  </app-container-form>


  <!-- Responsáveis / Participantes -->
  <app-container-form title="Participantes da visita">

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Agente responsável</label>
        <input
          type="text"
          class="form-control"
          [value]="visit()!.agentName"
          (input)="updateField('agentName', $any($event.target).value)"
          placeholder="Nome do agente">
      </div>

      <div class="col-md-6">
        <label class="form-label">Comunidade</label>
        <input
          type="text"
          class="form-control"
          [value]="visit()!.communityName"
          (input)="updateField('communityName', $any($event.target).value)"
          placeholder="Nome da comunidade visitada">
      </div>

    </div>

    <div class="row mt-3 g-3">

      <div class="col-md-6">
        <label class="form-label">Estado</label>
        <input
          type="text"
          class="form-control"
          [value]="visit()!.state"
          (input)="updateField('state', $any($event.target).value)"
          placeholder="Ex: RN, PB, CE...">
      </div>

      <div class="col-md-6">
        <label class="form-label">Aglomerado</label>
        <input
          type="text"
          class="form-control"
          [value]="visit()!.clusterName"
          (input)="updateField('clusterName', $any($event.target).value)"
          placeholder="Ex: Aglomerado Norte">
      </div>

    </div>

    <div class="row mt-3 g-3">
      <div class="col-md-6">
        <label class="form-label">ID do Aglomerado</label>
        <input
          type="number"
          class="form-control"
          [value]="visit()!.clusterId"
          (input)="updateField('clusterId', +$any($event.target).value)"
          placeholder="Ex: 12">
      </div>
    </div>

  </app-container-form>


  <!-- Agendamento / Cancelamento -->
  <app-container-form title="Agendamento">

    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Agendador</label>
        <input
          type="text"
          class="form-control"
          [value]="visit()!.schedulingPersonName"
          (input)="updateField('schedulingPersonName', $any($event.target).value)"
          placeholder="Nome de quem agendou a visita"
          required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Cancelador</label>
        <input
          type="text"
          class="form-control"
          [value]="visit()!.cancelPersonName"
          (input)="updateField('cancelPersonName', $any($event.target).value)"
          placeholder="Nome de quem cancelou, se houver">
      </div>

    </div>

  </app-container-form>


  <app-container-form title="Observações">

    <label class="form-label">Notas / Observações</label>
    <textarea
      class="form-control"
      rows="3"
      [value]="visit()!.notes"
      (input)="updateField('notes', $any($event.target).value)"
      placeholder="Informações adicionais sobre a visita...">
    </textarea>

  </app-container-form>


  <div class="container px-4 mb-5">
    <button
      type="submit"
      class="btn btn-primary btn-lg"
      [disabled]="loading()">
      <span>Salvar</span>
    </button>
  </div>

</form>

}
