<app-header></app-header>
<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>{{ isEdit() ? 'Editar' : 'Nova' }} Reunião</h3>
    </div>
    <div class="card-body">

      @if(loading()){
        <app-loading></app-loading>
      } @else {
        <form (ngSubmit)="save()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Data da Reunião</label>
              <input type="date" class="form-control" [(ngModel)]="meeting()!.meetingDate" required>
            </div>
            <div class="col-md-3 mb-3">
              <label>Hora Início</label>
              <input type="time" class="form-control" [(ngModel)]="meeting()!.startTime" required>
            </div>
            <div class="col-md-3 mb-3">
              <label>Hora Fim</label>
              <input type="time" class="form-control" [(ngModel)]="meeting()!.endTime" required>
            </div>
          </div>

          <div class="mb-3">
            <label>Título</label>
            <input type="text" class="form-control" [(ngModel)]="meeting()!.title" required>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label>Agente</label>
              <input type="text" class="form-control" [(ngModel)]="meeting()!.agentName">
            </div>
            <div class="col-md-6 mb-3">
              <label>Comunidade</label>
              <input type="text" class="form-control" [(ngModel)]="meeting()!.communityName">
            </div>
          </div>

          <div class="mb-3">
            <label>Agendador</label>
            <input type="text" class="form-control" [(ngModel)]="meeting()!.schedulingPersonName">
          </div>

          <div class="mb-3">
            <label>Observações</label>
            <textarea class="form-control" rows="3" [(ngModel)]="meeting()!.notes"></textarea>
          </div>

          <div class="mb-3">
            <label>Ata da Reunião</label>
            <textarea class="form-control" rows="5" [(ngModel)]="meeting()!.meetingMinutes"></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
